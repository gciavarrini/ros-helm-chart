name: Build and Push MinIO

on:
  workflow_dispatch:
    inputs:
      minio_version:
        description: 'MinIO version (e.g., RELEASE.2025-01-15T17-29-55Z or latest)'
        required: false
        default: 'latest'
      image_tag:
        description: 'Image tag (e.g., 2025.01.15 or latest)'
        required: false
        default: 'latest'
  push:
    branches:
      - main
      - build-minio
    paths:
      - '.github/workflows/build-minio.yml'
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM UTC

env:
  IMAGE_REPO: quay.io/gciavarrini/minio

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set build parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MINIO_VERSION="${{ github.event.inputs.minio_version }}"
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          else
            MINIO_VERSION="latest"
            IMAGE_TAG="scheduled"
          fi
          
          echo "minio_version=$MINIO_VERSION" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Building MinIO $MINIO_VERSION"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build MinIO binary
        id: build
        run: |
          echo "Building MinIO ${{ steps.params.outputs.minio_version }} using go install"
          echo "Command: go install github.com/minio/minio@${{ steps.params.outputs.minio_version }}"
          
          # Build and capture what Go resolved the version to
          go install -v github.com/minio/minio@${{ steps.params.outputs.minio_version }} 2>&1 | tee build.log
          
          # Get the exact version Go installed
          GO_MODULE_VERSION=$(grep "github.com/minio/minio" build.log | grep -oP '@v[0-9].*|@[A-Z].*' | head -1 | cut -d'@' -f2 || echo "")
          
          # Copy binary to workspace
          mkdir -p bin
          cp $(go env GOPATH)/bin/minio bin/
          
          # Get MinIO's actual version from the binary
          MINIO_VERSION=$(bin/minio --version 2>&1 | grep -oP 'RELEASE\.[0-9T\-Z]+' | head -1)
          
          # If we got a version, use it; otherwise fall back
          if [ -n "$MINIO_VERSION" ]; then
            ACTUAL_VERSION="$MINIO_VERSION"
          elif [ -n "$GO_MODULE_VERSION" ]; then
            ACTUAL_VERSION="$GO_MODULE_VERSION"
          else
            ACTUAL_VERSION="latest-$(date +%Y%m%d-%H%M%S)"
          fi
          
          echo "actual_version=$ACTUAL_VERSION" >> $GITHUB_OUTPUT
          echo ""
          echo "=========================================="
          echo "BUILD INFORMATION (for reproducibility)"
          echo "=========================================="
          echo "Input version:     ${{ steps.params.outputs.minio_version }}"
          echo "Go module version: $GO_MODULE_VERSION"
          echo "MinIO version:     $MINIO_VERSION"
          echo "Image tag:         $ACTUAL_VERSION"
          echo ""
          echo "To reproduce this build:"
          echo "  go install github.com/minio/minio@$MINIO_VERSION"
          echo "=========================================="

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM registry.access.redhat.com/ubi9/ubi-minimal:latest
          
          ENV MINIO_UPDATE=off
          
          COPY bin/minio /usr/bin/minio
          RUN chmod +x /usr/bin/minio
          
          EXPOSE 9000 9001
          
          ENTRYPOINT ["/usr/bin/minio"]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push multi-arch image
        run: |
          # Determine final tag
          if [ "${{ steps.params.outputs.image_tag }}" = "scheduled" ]; then
            VERSION_TAG="${{ steps.build.outputs.actual_version }}"
          else
            VERSION_TAG="${{ steps.params.outputs.image_tag }}"
          fi
          
          echo "Pushing image with tags: $VERSION_TAG and latest"
          
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ${{ env.IMAGE_REPO }}:$VERSION_TAG \
            -t ${{ env.IMAGE_REPO }}:latest \
            --push \
            .

      - name: Build summary
        run: |
          if [ "${{ steps.params.outputs.image_tag }}" = "scheduled" ]; then
            VERSION_TAG="${{ steps.build.outputs.actual_version }}"
          else
            VERSION_TAG="${{ steps.params.outputs.image_tag }}"
          fi
          
          echo ""
          echo "=========================================="
          echo "✅ BUILD COMPLETE"
          echo "=========================================="
          echo "MinIO Version: ${{ steps.build.outputs.actual_version }}"
          echo ""
          echo "Images pushed:"
          echo "  • ${{ env.IMAGE_REPO }}:$VERSION_TAG"
          echo "  • ${{ env.IMAGE_REPO }}:latest"
          echo ""
          echo "Pull command:"
          echo "  podman pull ${{ env.IMAGE_REPO }}:$VERSION_TAG"
          echo ""
          echo "Reproduce build:"
          echo "  go install github.com/minio/minio@${{ steps.build.outputs.actual_version }}"
          echo "=========================================="

